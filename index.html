<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Browser Search</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --muted: #6b6b6b;
  --text: #e4e4e4;
  --accent: #404040;
  --ring: #525252;
  --danger: #3b1a1a;
  --danger-border: #5c2727;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 30% 20%, rgba(64,64,64,0.15), transparent 70%),
    radial-gradient(ellipse 50% 70% at 70% 60%, rgba(50,50,50,0.10), transparent 70%),
    var(--bg);
}

.container {
  position: relative; z-index: 1;
  max-width: 800px; margin: 0 auto; padding: 80px 24px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 40px;
}

.logo {
  font-size: 48px; font-weight: 700; letter-spacing: -1.5px;
  background: linear-gradient(180deg, #f5f5f5 0%, #a0a0a0 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub {
  font-size: 14px; color: var(--muted); font-weight: 400;
  letter-spacing: 0.5px; text-transform: uppercase; margin-top: -32px;
}

.search-wrap { width: 100%; position: relative; }
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px;
}
.search-bar:focus-within { border-color: var(--ring); }
.search-bar input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 18px; padding: 16px;
  font-family: inherit; letter-spacing: 0.3px;
}
.search-bar input::placeholder { color: var(--muted); }
.search-bar .go-btn {
  background: #262626; color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.search-bar .go-btn:hover { background: #303030; border-color: var(--ring); }
.search-bar .fav-btn {
  background: transparent; color: var(--muted); border: 1px dashed var(--border);
}
.search-bar .fav-btn:hover { color: var(--text); background: var(--accent); border-style: solid; }

.sections {
  width: 100%; display: flex; gap: 20px;
}
.sections > * { flex: 1; min-width: 0; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.card-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.card-header h2 {
  font-size: 14px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted);
}
.card-header .clear-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; padding: 5px 12px; border-radius: 8px;
  cursor: pointer; font-family: inherit; letter-spacing: 0.5px;
}
.card-header .clear-btn:hover { color: #ff6b6b; border-color: var(--danger-border); background: var(--danger); }

.card-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 320px; overflow-y: auto;
}
.card-list::-webkit-scrollbar { width: 4px; }
.card-list::-webkit-scrollbar-track { background: transparent; }
.card-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
}
.list-item:hover { background: rgba(255,255,255,0.03); }
.list-item a {
  flex: 1; color: var(--text); text-decoration: none; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
}
.list-item a:hover { color: #fff; }
.list-item .favicon {
  width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;
  background: var(--accent); display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: var(--muted);
}
.list-item .item-actions {
  display: flex; gap: 6px; flex-shrink: 0;
}
.list-item .item-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; padding: 4px 10px; border-radius: 6px;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.list-item .item-btn:hover { color: var(--text); border-color: var(--ring); background: var(--accent); }
.list-item .item-btn.del:hover { color: #ff6b6b; border-color: var(--danger-border); background: var(--danger); }

.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

/* Toast */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 12px 24px; border-radius: 12px; font-size: 14px;
  z-index: 200; opacity: 0; visibility: hidden;
  pointer-events: none; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.toast.show { opacity: 1; visibility: visible; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px; max-width: 400px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.modal p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; word-break: break-all; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.modal-cancel {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 10px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.modal-cancel:hover { color: var(--text); border-color: var(--ring); background: var(--accent); }
.modal-confirm {
  background: var(--danger); border: 1px solid var(--danger-border); color: #ff6b6b;
  padding: 10px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <h1 class="logo">Browser Search</h1>
  <p class="logo-sub">Search the web on PS5</p>

  <div class="search-wrap">
    <div class="search-bar">
      <input id="url" type="url" value="http://" placeholder="Enter URL or search...">
      <button class="go-btn" onclick="go()">Open</button>
      <button class="go-btn fav-btn" onclick="favInput()">Fav</button>
    </div>
  </div>

  <div class="sections">
    <div class="card">
      <div class="card-header">
        <h2>Favorites</h2>
        <button class="clear-btn" onclick="showModal('Clear all favorites?','This cannot be undone.', clearFavorites)">Clear All</button>
      </div>
      <div id="favs" class="card-list"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>History</h2>
        <button class="clear-btn" onclick="showModal('Clear all history?','This cannot be undone.', clearHistory)">Clear All</button>
      </div>
      <div id="hist" class="card-list"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script>
var urlInput = document.getElementById('url');
var favsEl = document.getElementById('favs');
var histEl = document.getElementById('hist');
var toastEl = document.getElementById('toast');
var modalRoot = document.getElementById('modal-root');

var HISTORY_MAX = 50;
var SEARCH_URL = 'https://duckduckgo.com/?q=';

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
}

var modalConfirmFn = null;
function showModal(title, desc, onConfirm) {
  modalConfirmFn = onConfirm;
  modalRoot.innerHTML =
    '<div class="modal-overlay" id="mo"><div class="modal"><h3></h3><p></p>' +
    '<div class="modal-actions"><button type="button" class="modal-cancel" id="mCancel">Cancel</button>' +
    '<button type="button" class="modal-confirm" id="mOk">Delete</button></div></div></div>';
  modalRoot.querySelector('h3').textContent = title;
  modalRoot.querySelector('p').textContent = desc;
  modalRoot.querySelector('.modal-overlay').addEventListener('click', function(ev){
    if (ev.target.id === 'mo') closeModal();
  });
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mOk').addEventListener('click', function(){
    var fn = modalConfirmFn;
    closeModal();
    if (fn) fn();
  });
}
function closeModal() {
  modalRoot.innerHTML = '';
  modalConfirmFn = null;
}

if (!navigator.userAgent.includes('PlayStation 5')) {
  window.addEventListener('load', function(){ showToast('This page displays best on PS5'); });
}

function normalizeUrl(raw) {
  var v = String(raw == null ? '' : raw).trim();
  if (!v) return null;
  if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(v)) v = 'http://' + v;
  try {
    var u = new URL(v);
    return {
      href: u.href,
      key: u.hostname.toLowerCase() + '/' + (u.pathname + u.search + u.hash).toLowerCase()
    };
  } catch (e) {
    return null;
  }
}

function looksLikeUrl(v) {
  if (/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(v)) {
    var rest = v.replace(/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//, '');
    var host = rest.split(/[\/?#:@]/)[0].split(':')[0];
    if (!host) return false;
    return host.indexOf('.') !== -1 || /^localhost$/i.test(host) ||
           /^\d{1,3}(\.\d{1,3}){3}$/.test(host) || host.indexOf(':') !== -1;
  }
  if (/\s/.test(v)) return false;
  if (/^localhost(:\d+)?([\/?#].*)?$/i.test(v)) return true;
  if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?([\/?#].*)?$/.test(v)) return true;
  return /^[a-zA-Z0-9]([a-zA-Z0-9\-]*\.)+[a-zA-Z]{2,}(:\d+)?([\/?#].*)?$/.test(v);
}

function resolveInput() {
  var val = urlInput.value.trim();
  if (!val || val === 'http://' || val === 'https://') return null;
  if (!looksLikeUrl(val)) {
    var q = val.replace(/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//, '');
    return SEARCH_URL + encodeURIComponent(q);
  }
  var n = normalizeUrl(val);
  return n ? n.href : SEARCH_URL + encodeURIComponent(val.replace(/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//, ''));
}

function go() {
  var target = resolveInput();
  if (!target) return;
  addHistory(target);
  window.location.href = target;
}

function favInput() {
  var target = resolveInput();
  if (!target) return;
  addFav(target);
}

function loadList(key) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    if (Array.isArray(arr)) {
      return arr.filter(function(e){ return e && typeof e.u === 'string' && e.u; })
                .map(function(e){ return { u: e.u, t: typeof e.t === 'number' ? e.t : 0 }; });
    }
  } catch (err) {}
  return [];
}

function saveList(key, list) {
  try {
    localStorage.setItem(key, JSON.stringify(list));
  } catch (err) {}
}

function findIndexByKey(list, key) {
  for (var i = 0; i < list.length; i++) {
    var n = normalizeUrl(list[i].u);
    if (n && n.key === key) return i;
  }
  return -1;
}

function addHistory(url) {
  var n = normalizeUrl(url);
  if (!n) return;
  var list = loadList('history');
  var i = findIndexByKey(list, n.key);
  if (i !== -1) list.splice(i, 1);
  list.unshift({ u: n.href, t: Date.now() });
  if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
  saveList('history', list);
  renderAll();
}

function remHist(key) {
  saveList('history', loadList('history').filter(function(e){
    var n = normalizeUrl(e.u);
    return !n || n.key !== key;
  }));
  renderAll();
  showToast('Removed');
}

function clearHistory() {
  saveList('history', []);
  renderAll();
  showToast('History cleared');
}

function addFav(url) {
  var n = normalizeUrl(url);
  if (!n) return;
  var list = loadList('fav');
  if (findIndexByKey(list, n.key) !== -1) {
    showToast('Already saved');
    return;
  }
  list.unshift({ u: n.href, t: Date.now() });
  saveList('fav', list);
  renderAll();
  showToast('Saved');
}

function remFav(key) {
  saveList('fav', loadList('fav').filter(function(e){
    var n = normalizeUrl(e.u);
    return !n || n.key !== key;
  }));
  renderAll();
  showToast('Removed');
}

function clearFavorites() {
  saveList('fav', []);
  renderAll();
  showToast('Favorites cleared');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function entryLabel(url) {
  return url.replace(/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//, '').replace(/\/$/, '');
}

function renderList(el, list, kind) {
  if (!list.length) {
    el.innerHTML = '<p class="empty">Nothing here yet</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var url = list[i].u;
    var label = entryLabel(url);
    var short = label.length > 60 ? label.slice(0, 57) + '...' : label;
    var domain = '';
    try { domain = new URL(url).hostname.replace(/^www\./i, ''); } catch (err) {}
    var btns = '';
    if (kind === 'hist') {
      btns = '<button type="button" class="item-btn" data-i="' + i + '" data-act="save">Save</button>' +
             '<button type="button" class="item-btn del" data-i="' + i + '" data-act="del">Del</button>';
    } else {
      btns = '<button type="button" class="item-btn del" data-i="' + i + '" data-act="del">Del</button>';
    }
    html += '<div class="list-item">' +
      '<div class="favicon">' + escapeHtml(domain ? domain.slice(0, 2).toUpperCase() : '?') + '</div>' +
      '<a data-i="' + i + '" href="' + escapeHtml(url) + '" title="' + escapeHtml(label) + '">' + escapeHtml(short) + '</a>' +
      '<div class="item-actions">' + btns + '</div>' +
      '</div>';
  }
  el.innerHTML = html;
}

function findDataTarget(node) {
  while (node) {
    if (node.nodeType === 1 && node.hasAttribute && node.hasAttribute('data-i')) return node;
    node = node.parentNode;
  }
  return null;
}

function handleAction(kind, act, idx) {
  var list = loadList(kind === 'hist' ? 'history' : 'fav');
  var entry = list[idx];
  if (!entry) { renderAll(); return; }
  var n = normalizeUrl(entry.u);
  if (!n) { renderAll(); return; }
  if (act === 'open') {
    addHistory(n.href);
    window.location.href = n.href;
  } else if (act === 'save') {
    addFav(n.href);
  } else if (kind === 'hist') {
    remHist(n.key);
  } else {
    remFav(n.key);
  }
}

function onListClick(ev, kind) {
  var t = findDataTarget(ev.target);
  if (!t) return;
  ev.preventDefault();
  handleAction(kind, t.getAttribute('data-act') || 'open', parseInt(t.getAttribute('data-i'), 10));
}

function renderAll() {
  renderList(favsEl, loadList('fav'), 'fav');
  renderList(histEl, loadList('history'), 'hist');
}

favsEl.addEventListener('click', function(ev){ onListClick(ev, 'fav'); });
histEl.addEventListener('click', function(ev){ onListClick(ev, 'hist'); });

urlInput.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' || ev.keyCode === 13) go();
});

(function migrateLegacyStorage() {
  ['fav', 'history'].forEach(function(k){
    var raw;
    try { raw = localStorage.getItem(k); } catch (e) { raw = null; }
    if (!raw) {
      saveList(k, []);
      return;
    }
    try {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) return;
    } catch (err) {}
    var migrated = [];
    var re = /href="([^"]+)"/g;
    var m;
    while ((m = re.exec(raw)) !== null) {
      var n = normalizeUrl(m[1]);
      if (n && findIndexByKey(migrated, n.key) === -1) migrated.push({ u: n.href, t: 0 });
    }
    saveList(k, migrated);
  });
})();

renderAll();
</script>
</body>
</html>
